[project]
name = "Retrieval with Ranker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Syed Musharraf Ali", email = "alisyedmusharraf1995@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.3.11",
    "datasets>=5.0.1",
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "langfuse>=4.15.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "sentence-transformers>=6.0.1",
    "torch==2.6.0+cu124",
    "torchaudio==2.6.0+cu124",
    "torchvision==0.21.0+cu124",
]

[project.scripts]
evaluation-harness = "evaluation_harness:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true